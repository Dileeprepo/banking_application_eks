# App-of-apps root. Apply this ONCE (with project.yaml). It watches
# deploy/argocd/apps/ and auto-creates every Application found there
# (banking-platform, cert-manager, observability/*). Add a new app file to that
# directory and Argo CD creates it on the next sync — no manual kubectl apply.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: banking
  source:
    repoURL: "https://github.com/Dileeprepo/banking_application_eks.git"
    targetRevision: main
    path: deploy/argocd/apps
    directory:
      recurse: true # include the observability/ subdirectory
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd # child Application objects live in the argocd namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
