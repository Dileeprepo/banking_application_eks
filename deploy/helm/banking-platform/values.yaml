# =============================================================================
# banking-platform umbrella chart — flat values (one block per service).
# Each <service> block drives templates/<service>.yaml (Deployment + Service +
# ConfigMap + Secret + HPA). CI patches each rebuilt service's `image:` string.
# =============================================================================

namespace: banking
imagePullPolicy: IfNotPresent
env:
  environment: development
  logLevel: info
  logFormat: json
# Shared database connection (single DB, per-service table prefixes).
db:
  host: postgres
  port: "5432"
  name: banking
  sslmode: disable
redis:
  name: redis
  servicename: redis
  image: redis:7-alpine
  port: 6379
kafka:
  name: kafka
  servicename: kafka
  image: apache/kafka:3.8.1
  brokers: "kafka:9092"
  storage: 2Gi
  storageClass: ""
otel:
  enabled: "true"
  endpoint: "otel-collector.observability.svc.cluster.local:4317"
  insecure: "true"
# Used only by document-service.
s3:
  enabled: "false"
  region: us-east-1
  bucket: banking-documents
# DEV DEFAULTS ONLY — override per environment / use a secrets manager.
secrets:
  dbUser: banking
  dbPassword: banking
  jwtSecret: dev-secret-change-me
  jwtIssuer: banking-platform
