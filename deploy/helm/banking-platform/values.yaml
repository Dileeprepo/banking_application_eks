# ---------------------------------------------------------------------------
# In-cluster PostgreSQL (Redis/Kafka defined above)
# ---------------------------------------------------------------------------
postgres:
  name: postgres
  servicename: postgres
  image: postgres:16-alpine
  port: 5432
  storage: 2Gi
  storageClass: ""
# ---------------------------------------------------------------------------
# Ingress (Traefik) + TLS (cert-manager) — Phase 11. Disabled by default;
# kind uses the NodePorts above. Set enabled/tls/host for EKS.
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: traefik
  host: vijaygiduthuri.in
  tls: true # cert-manager auto-issues banking-tls via ingress-shim
  tlsSecretName: banking-tls
  clusterIssuer: letsencrypt-prod
